name: P0-C Hotkey Guard One-Shot

on:
  push:
    branches:
      - fix/p0c-decision-safety
    paths:
      - ".github/workflows/p0c-hotkey-guard-once.yml"

permissions:
  contents: write

jobs:
  patch-hotkeys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0c-decision-safety
          fetch-depth: 0
      - name: Apply hotkey safety patch
        run: python3 .github/scripts/p0c_hotkey_guard_patch.py
      - name: Remove one-shot machinery
        run: |
          rm .github/scripts/p0c_hotkey_guard_patch.py
          rm .github/workflows/p0c-hotkey-guard-once.yml
      - name: Commit hotkey guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/scripts/p0c_hotkey_guard_patch.py .github/workflows/p0c-hotkey-guard-once.yml
          git diff --cached --check
          git commit -m "fix: prevent tactical hotkey input bleed"
          git push origin HEAD:fix/p0c-decision-safety
