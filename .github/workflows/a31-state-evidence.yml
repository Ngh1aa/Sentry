name: A31 State Evidence QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [a31/external-evidence-pipeline]

permissions:
  contents: read

jobs:
  recovery-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sentry-a31-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/recovery-scenario.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/sentry-a31-server.log
          exit 1
      - name: Verify failure, preservation, retry and mobile overflow
        run: node qa/a31-state-evidence.spec.mjs
