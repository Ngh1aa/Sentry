name: P0-B Secondary Truth One-Shot

on:
  push:
    branches:
      - fix/p0b-truthful-metrics
    paths:
      - ".github/workflows/p0b-secondary-truth-once.yml"

permissions:
  contents: write

jobs:
  apply-secondary-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0b-truthful-metrics
          fetch-depth: 0
      - name: Patch runtime source-of-truth
        run: python3 .github/scripts/p0b_secondary_truth_patch.py
      - name: Remove one-shot machinery
        run: |
          rm .github/scripts/p0b_secondary_truth_patch.py
          rm .github/workflows/p0b-secondary-truth-once.yml
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/secondary.js .github/scripts/p0b_secondary_truth_patch.py .github/workflows/p0b-secondary-truth-once.yml
          git diff --cached --check
          git commit -m "fix: make secondary analytics outcomes evidence-safe"
          git push origin HEAD:fix/p0b-truthful-metrics
