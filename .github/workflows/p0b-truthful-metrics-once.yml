name: P0-B Truthful Metrics One-Shot

on:
  push:
    branches:
      - fix/p0b-truthful-metrics
    paths:
      - ".github/workflows/p0b-truthful-metrics-once.yml"

permissions:
  contents: write

jobs:
  apply-p0b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0b-truthful-metrics
          fetch-depth: 0

      - name: Apply evidence-safe metrics patch
        run: python3 .github/scripts/p0b_truthful_metrics.py

      - name: Remove one-shot patch machinery
        run: |
          rm .github/scripts/p0b_truthful_metrics.py
          rm .github/workflows/p0b-truthful-metrics-once.yml

      - name: Commit patched product + QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js qa/evidence-lens.spec.mjs .github/scripts/p0b_truthful_metrics.py .github/workflows/p0b-truthful-metrics-once.yml
          git diff --cached --check
          git commit -m "fix: make Sentry analytics metrics evidence-safe"
          git push origin HEAD:fix/p0b-truthful-metrics
