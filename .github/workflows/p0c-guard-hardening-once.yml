name: P0-C Guard Hardening One-Shot

on:
  push:
    branches:
      - fix/p0c-decision-safety
    paths:
      - ".github/workflows/p0c-guard-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden-p0c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0c-decision-safety
          fetch-depth: 0
      - name: Apply guard hardening
        run: python3 .github/scripts/p0c_guard_hardening.py
      - name: Remove one-shot machinery
        run: |
          rm .github/scripts/p0c_guard_hardening.py
          rm .github/workflows/p0c-guard-hardening-once.yml
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js qa/evidence-lens.spec.mjs .github/scripts/p0c_guard_hardening.py .github/workflows/p0c-guard-hardening-once.yml
          git diff --cached --check
          git commit -m "fix: harden decision commit guardrails"
          git push origin HEAD:fix/p0c-decision-safety
