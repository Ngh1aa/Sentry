<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>SENTRY — Operational State Matrix</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#f2f3f5;color:#191b22;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.head p{font:700 10px ui-monospace,monospace;letter-spacing:.09em;color:#6a6f7a;margin:0 0 6px}.head h1{font-size:25px;margin:0}.head a{font:700 10px ui-monospace,monospace;color:#322761}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-width:0;border:1px solid #d7dae0;background:#fff}.tile-head{height:40px;padding:0 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e3e7;font:700 10px ui-monospace,monospace}.tile-head span{color:#777c86;font-weight:600}.viewport{height:520px}.viewport iframe{display:block;width:100%;height:100%;border:0;background:white}@media(max-width:1050px){.grid{grid-template-columns:1fr}.viewport{height:600px}}@media(max-width:620px){body{padding:12px}.head{display:block}.head a{display:inline-block;margin-top:10px}.viewport{height:640px}}
  </style>
</head>
<body>
<header class="head"><div><p>RECRUITER EVIDENCE / FAILURE-AWARE OPERATIONS</p><h1>Sentry state matrix</h1></div><a href="recruiter-state-lab.html?state=normal">OPEN INTERACTIVE STATE LAB →</a></header>
<main class="grid">
  <section class="tile"><div class="tile-head"><strong>01 / EMPTY</strong><span>0 alerts waiting</span></div><div class="viewport"><iframe title="Sentry empty queue state" src="recruiter-state-lab.html?state=empty&pin=1&matrix=1"></iframe></div></section>
  <section class="tile"><div class="tile-head"><strong>02 / LOADING</strong><span>Forensic correlation</span></div><div class="viewport"><iframe title="Sentry forensic loading state" src="recruiter-state-lab.html?state=loading&pin=1&matrix=1"></iframe></div></section>
  <section class="tile"><div class="tile-head"><strong>03 / ERROR</strong><span>Decision service failure</span></div><div class="viewport"><iframe title="Sentry decision error state" src="recruiter-state-lab.html?state=error&pin=1&matrix=1"></iframe></div></section>
  <section class="tile"><div class="tile-head"><strong>04 / EDGE</strong><span>50 linked transactions</span></div><div class="viewport"><iframe title="Sentry evidence stress state" src="recruiter-state-lab.html?state=edge&pin=1&matrix=1"></iframe></div></section>
</main>
<script>
  document.querySelectorAll('iframe').forEach(frame => frame.addEventListener('load', () => {
    try {
      const doc=frame.contentDocument;
      const bar=doc.querySelector('.labbar'); if(bar) bar.style.display='none';
      const flag=doc.querySelector('.flag'); if(flag) flag.style.display='none';
      const wrap=doc.querySelector('.wrap'); if(wrap) wrap.style.height='100%';
    } catch {}
  }));
</script>
</body>
</html>
